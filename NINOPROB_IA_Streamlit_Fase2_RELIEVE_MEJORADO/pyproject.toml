[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ninoprob-ia-streamlit"
version = "2.0.0"
description = "NIÑOPROB-IA: regresión logística y explorador 3D NOAA en Streamlit"
requires-python = ">=3.10"
dependencies = [
  "streamlit>=1.49,<2",
  "pydeck>=0.9,<1",
  "plotly>=5.20,<7",
  "numpy>=1.24,<3",
  "pandas>=2.0,<3",
  "scikit-learn>=1.3,<2",
  "matplotlib>=3.7,<4",
  "joblib>=1.3,<2",
  "requests>=2.31,<3",
  "xarray>=2024.1,<2027",
  "scipy>=1.11,<2",
  "netCDF4>=1.6,<2",
  "fastapi>=0.105,<1",
  "uvicorn>=0.25,<1",
]
[project.optional-dependencies]
test = ["pytest>=7.4,<10", "httpx>=0.25,<1"]
[tool.setuptools]
packages = ["ninoprob_ia"]
[tool.pytest.ini_options]
testpaths = ["tests"]
